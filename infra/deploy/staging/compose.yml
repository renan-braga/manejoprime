name: ${COMPOSE_PROJECT_NAME:-curralzap-staging}

services:
  reverse-proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
      admin-web:
        condition: service_started
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_ADMIN_DOMAIN: ${PUBLIC_ADMIN_DOMAIN}
      PUBLIC_API_DOMAIN: ${PUBLIC_API_DOMAIN}
      TLS_ACME_EMAIL: ${TLS_ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EVOLUTION_POSTGRES_DB: ${EVOLUTION_POSTGRES_DB}
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:4.0.2
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-127.0.0.1}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  evolution-api:
    image: atendai/evolution-api:v2.1.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${EVOLUTION_API_PORT:-8088}:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_POSTGRES_DB}
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances

  backend-api:
    image: ghcr.io/${GHCR_OWNER}/curralzap-backend-api:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${BACKEND_API_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_DRIVER_CLASS_NAME: org.postgresql.Driver
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAGIC_LINK_BASE_URL: ${MAGIC_LINK_BASE_URL}
      API_CORS_ALLOWED_ORIGINS: ${API_CORS_ALLOWED_ORIGINS}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EVOLUTION_BASE_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      WHATSAPP_AUDIO_STORAGE_ROOT: /data/whatsapp-audio
      WHATSAPP_AUDIO_DOWNLOAD_CONSUMER_GROUP: ${WHATSAPP_AUDIO_DOWNLOAD_CONSUMER_GROUP}
      WHATSAPP_AUDIO_TRANSCODE_CONSUMER_GROUP: ${WHATSAPP_AUDIO_TRANSCODE_CONSUMER_GROUP}
      WHATSAPP_AUDIO_TRANSCRIPTION_CONSUMER_GROUP: ${WHATSAPP_AUDIO_TRANSCRIPTION_CONSUMER_GROUP}
      WHATSAPP_MESSAGE_RECEIVED_TOPIC: ${WHATSAPP_MESSAGE_RECEIVED_TOPIC}
      WHATSAPP_AUDIO_TRANSCODE_REQUESTED_TOPIC: ${WHATSAPP_AUDIO_TRANSCODE_REQUESTED_TOPIC}
      WHATSAPP_AUDIO_TRANSCRIPTION_REQUESTED_TOPIC: ${WHATSAPP_AUDIO_TRANSCRIPTION_REQUESTED_TOPIC}
    volumes:
      - whatsapp_audio_storage:/data/whatsapp-audio
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/internal/readiness >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  backend-worker:
    image: ghcr.io/${GHCR_OWNER}/curralzap-backend-worker:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_DRIVER_CLASS_NAME: org.postgresql.Driver
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EVOLUTION_BASE_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      WHATSAPP_AUDIO_STORAGE_ROOT: /data/whatsapp-audio
      WHATSAPP_AUDIO_DOWNLOAD_CONSUMER_GROUP: ${WHATSAPP_AUDIO_DOWNLOAD_CONSUMER_GROUP}
      WHATSAPP_AUDIO_TRANSCODE_CONSUMER_GROUP: ${WHATSAPP_AUDIO_TRANSCODE_CONSUMER_GROUP}
      WHATSAPP_AUDIO_TRANSCRIPTION_CONSUMER_GROUP: ${WHATSAPP_AUDIO_TRANSCRIPTION_CONSUMER_GROUP}
      WHATSAPP_MESSAGE_RECEIVED_TOPIC: ${WHATSAPP_MESSAGE_RECEIVED_TOPIC}
      WHATSAPP_AUDIO_TRANSCODE_REQUESTED_TOPIC: ${WHATSAPP_AUDIO_TRANSCODE_REQUESTED_TOPIC}
      WHATSAPP_AUDIO_TRANSCRIPTION_REQUESTED_TOPIC: ${WHATSAPP_AUDIO_TRANSCRIPTION_REQUESTED_TOPIC}
    volumes:
      - whatsapp_audio_storage:/data/whatsapp-audio
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/internal/readiness >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  admin-web:
    image: ghcr.io/${GHCR_OWNER}/curralzap-admin-web:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${ADMIN_WEB_PORT:-8081}:80"
    environment:
      CURRALZAP_API_BASE_URL: ${ADMIN_WEB_API_BASE_URL}

volumes:
  caddy_config:
  caddy_data:
  evolution_instances:
  kafka_data:
  postgres_data:
  redis_data:
  whatsapp_audio_storage:
