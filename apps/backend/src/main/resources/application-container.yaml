server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:curralzap_container;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

curralzap:
  ops:
    api-key: ${OPS_API_KEY}
  api:
    cors:
      allowed-origins: ${API_CORS_ALLOWED_ORIGINS:http://localhost:8081}
  auth:
    magic-link:
      base-url: ${MAGIC_LINK_BASE_URL:http://localhost:5173/auth/callback?token=}
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT8H}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
    microsoft:
      client-id: ${MICROSOFT_CLIENT_ID:}
      client-secret: ${MICROSOFT_CLIENT_SECRET:}
  asaas:
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
    api-key: ${ASAAS_API_KEY:}
    base-url: ${ASAAS_BASE_URL:https://www.asaas.com/api/v3}
  whatsapp:
    audio:
      storage-root: ${WHATSAPP_AUDIO_STORAGE_ROOT:}
    webhook:
      secret: ${WHATSAPP_WEBHOOK_SECRET}
    kafka:
      retry:
        dead-letter-suffix: ${WHATSAPP_KAFKA_DEAD_LETTER_SUFFIX:.dlt}
        interval-ms: ${WHATSAPP_KAFKA_RETRY_INTERVAL_MS:1000}
        max-attempts: ${WHATSAPP_KAFKA_RETRY_MAX_ATTEMPTS:3}
      consumer-groups:
        audio-download: ${WHATSAPP_AUDIO_DOWNLOAD_CONSUMER_GROUP:curralzap-whatsapp-audio-download}
        audio-transcode: ${WHATSAPP_AUDIO_TRANSCODE_CONSUMER_GROUP:curralzap-whatsapp-audio-transcode}
        audio-transcription: ${WHATSAPP_AUDIO_TRANSCRIPTION_CONSUMER_GROUP:curralzap-whatsapp-audio-transcription}
        outbound-delivery: ${WHATSAPP_OUTBOUND_DELIVERY_CONSUMER_GROUP:curralzap-whatsapp-outbound-delivery}
        payload-validation: ${WHATSAPP_PAYLOAD_VALIDATION_CONSUMER_GROUP:curralzap-whatsapp-payload-validation}
        transcript-extraction: ${WHATSAPP_TRANSCRIPT_EXTRACTION_CONSUMER_GROUP:curralzap-whatsapp-transcript-extraction}
        button-confirmation: ${WHATSAPP_BUTTON_CONFIRMATION_CONSUMER_GROUP:curralzap-whatsapp-button-confirmation}
      topics:
        audio-transcode-requested: ${WHATSAPP_AUDIO_TRANSCODE_REQUESTED_TOPIC:whatsapp.audio.transcode.requested}
        audio-transcription-requested: ${WHATSAPP_AUDIO_TRANSCRIPTION_REQUESTED_TOPIC:whatsapp.audio.transcription.requested}
        message-received: ${WHATSAPP_MESSAGE_RECEIVED_TOPIC:whatsapp.message.received}
        outbound-delivery-requested: ${WHATSAPP_OUTBOUND_DELIVERY_REQUESTED_TOPIC:whatsapp.outbound.delivery.requested}
        payload-validation-requested: ${WHATSAPP_PAYLOAD_VALIDATION_REQUESTED_TOPIC:whatsapp.payload.validation.requested}
        transcript-extraction-requested: ${WHATSAPP_TRANSCRIPT_EXTRACTION_REQUESTED_TOPIC:whatsapp.transcript.extraction.requested}
        button-confirmation-requested: ${WHATSAPP_BUTTON_CONFIRMATION_REQUESTED_TOPIC:whatsapp.button.confirmation.requested}
    evolution:
      api-key: ${EVOLUTION_API_KEY:}
      base-url: ${EVOLUTION_BASE_URL:http://localhost:8080}
      instance: ${EVOLUTION_INSTANCE:curralzap}
      message-delay-ms: ${EVOLUTION_MESSAGE_DELAY_MS:0}
    validation:
      free-tier-daily-weighing-limit: ${WHATSAPP_FREE_TIER_DAILY_WEIGHING_LIMIT:10}
    extraction:
      openai:
        api-key: ${OPENAI_API_KEY:}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        model: ${WHATSAPP_TRANSCRIPT_EXTRACTION_MODEL:gpt-5.4-mini}
    transcription:
      openai:
        api-key: ${OPENAI_API_KEY:}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        model: ${WHATSAPP_AUDIO_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
