name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend test suite
        working-directory: apps/backend
        run: mvn test

      - name: Build backend package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/backend
        run: mvn -DskipTests package

      - name: Upload backend package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: apps/backend/target/*.jar
          if-no-files-found: error

  admin-web:
    name: Admin Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Rollup Linux native package
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")

      - name: Run admin web tests (file by file)
        working-directory: apps/admin-web
        run: |
          set -e
          for f in src/test/*.test.tsx src/test/*.test.ts; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            npx vitest run "$f"
            echo "::endgroup::"
          done
        env:
          NODE_OPTIONS: --max-old-space-size=4096 --expose-gc

      - name: Build admin web
        run: npm run build --workspace @curralzap/admin-web

      - name: Build Storybook
        run: npm run storybook:build --workspace @curralzap/admin-web
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload admin web artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: apps/admin-web/dist
          if-no-files-found: error
